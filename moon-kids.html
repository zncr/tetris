<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Hello Moon!</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#1b2150; font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  #app { display:flex; flex-direction:column; height:100%; max-width:900px; margin:0 auto; padding:10px; gap:10px; }
  #stage { position:relative; flex:1; min-height:0; border-radius:24px; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
  #caption { position:absolute; left:0; right:0; top:10px; text-align:center; font-size:clamp(22px,5vw,40px); font-weight:700; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.35); padding:0 12px; pointer-events:none; }
  #hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; color:#fff; font-size:clamp(14px,3vw,20px); text-shadow:0 2px 0 rgba(0,0,0,.4); pointer-events:none; }
  #bar { display:flex; gap:10px; justify-content:center; }
  button { flex:1; max-width:200px; min-height:84px; border:0; border-radius:24px; font-size:clamp(34px,8vw,52px); background:#fff; box-shadow:0 6px 0 rgba(0,0,0,.3); cursor:pointer; font-family:inherit; line-height:1.1; }
  button span { display:block; font-size:clamp(12px,2.6vw,16px); font-weight:700; color:#444; }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  button.on { background:#ffe27a; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="caption"></div>
    <div id="hint">Drag the sky, or tap the Sun and Moon!</div>
  </div>
  <div id="bar">
    <button data-h="8" data-d="22.1">🌅<span>Morning</span></button>
    <button data-h="15" data-d="7.4">🌞<span>Afternoon</span></button>
    <button data-h="22" data-d="7.4">🌙<span>Night</span></button>
    <button id="play">▶️<span>Watch</span></button>
    <button id="voice" class="on">🔊<span>Voice</span></button>
  </div>
</div>
<script>
const TAU = Math.PI * 2, D2R = Math.PI / 180, SYNODIC = 29.53;
const $ = id => document.getElementById(id);
const cv = $('c'), c = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rot = (v, a) => [v[0]*Math.cos(a) - v[1]*Math.sin(a), v[0]*Math.sin(a) + v[1]*Math.cos(a)];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1];
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = x => `rgb(${x[0]},${x[1]},${x[2]})`;
const SUN = [-1, 0];

let day = 7.4, hour = 15, playing = false, voiceOn = true, W = 800, H = 500, wig = { sun: 0, moon: 0 };
const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.8, r: Math.random() * 2.5 + 1, p: Math.random() * 6 }));

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; W = r.width; H = r.height;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

function geo() {
  const elong = (day / SYNODIC) * TAU, m = rot(SUN, elong), n = rot(SUN, (hour - 12) * 15 * D2R);
  return { elong, m, n, east: rot(n, Math.PI / 2), sunAlt: dot(n, SUN), moonAlt: dot(n, m) };
}
function skyColors(sa) {
  const night = [[12, 14, 60], [30, 28, 90]], twi = [[120, 90, 170], [255, 160, 110]], dayc = [[70, 170, 255], [190, 230, 255]];
  if (sa < 0) { const k = clamp((sa + 0.2) / 0.2, 0, 1); return [mix(night[0], twi[0], k), mix(night[1], twi[1], k)]; }
  const k = clamp(sa / 0.35, 0, 1); return [mix(twi[0], dayc[0], k), mix(twi[1], dayc[1], k)];
}
function face(x, y, r, wiggle) {
  c.fillStyle = '#5a3b1a'; c.strokeStyle = '#5a3b1a'; c.lineWidth = r * 0.08; c.lineCap = 'round';
  c.beginPath(); c.arc(x - r * 0.3, y - r * 0.15, r * 0.09, 0, TAU); c.fill();
  c.beginPath(); c.arc(x + r * 0.3, y - r * 0.15, r * 0.09, 0, TAU); c.fill();
  c.beginPath(); c.arc(x, y + r * 0.05, r * (0.3 + wiggle * 0.1), 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  c.fillStyle = 'rgba(255,120,120,.35)';
  c.beginPath(); c.arc(x - r * 0.5, y + r * 0.12, r * 0.12, 0, TAU); c.fill();
  c.beginPath(); c.arc(x + r * 0.5, y + r * 0.12, r * 0.12, 0, TAU); c.fill();
}
function drawSun(x, y, r) {
  const t = performance.now() / 1000, w = wig.sun;
  c.save(); c.translate(x, y); c.rotate(Math.sin(t * 40) * 0.15 * w);
  c.strokeStyle = '#ffb703'; c.lineWidth = r * 0.14; c.lineCap = 'round';
  for (let i = 0; i < 12; i++) { const a = i * TAU / 12 + t * 0.3, l = r * (1.35 + 0.1 * Math.sin(t * 2 + i)); c.beginPath(); c.moveTo(Math.cos(a) * r * 1.15, Math.sin(a) * r * 1.15); c.lineTo(Math.cos(a) * l, Math.sin(a) * l); c.stroke(); }
  c.fillStyle = '#ffd93d'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
  face(0, 0, r, w); c.restore();
}
function drawMoon(x, y, r, elong, angle) {
  const t = performance.now() / 1000, w = wig.moon;
  c.save(); c.translate(x, y); c.rotate(angle + Math.sin(t * 40) * 0.2 * w);
  c.fillStyle = 'rgba(120,120,160,.15)'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();   // dim side (earthshine)
  const cs = Math.cos(elong);
  c.beginPath(); c.moveTo(0, -r); c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
  for (let a = Math.PI / 2; a >= -Math.PI / 2 - 1e-6; a -= 0.1) c.lineTo(r * cs * Math.cos(a), r * Math.sin(a));
  c.closePath(); c.shadowColor = 'rgba(255,255,200,.9)'; c.shadowBlur = r * 0.4; c.fillStyle = '#fff6cf'; c.fill(); c.shadowBlur = 0;
  c.restore();
  face(x + Math.cos(angle) * r * 0.38, y + Math.sin(angle) * r * 0.38, r * 0.62, w);   // upright face on the lit side
}
function cloud(x, y, s) {
  c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath();
  [[0, 0, 30], [30, -12, 36], [64, 0, 30], [32, 10, 34]].forEach(([dx, dy, r]) => { c.moveTo(x + (dx + r) * s, y + dy * s); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); });
  c.fill();
}
let body = { sun: null, moon: null };
function draw() {
  const g = geo(), hz = H * 0.8, t = performance.now() / 1000;
  const [top, hor] = skyColors(g.sunAlt), bright = clamp((g.sunAlt + 0.2) / 0.55, 0, 1);
  const grad = c.createLinearGradient(0, 0, 0, hz); grad.addColorStop(0, rgb(top)); grad.addColorStop(1, rgb(hor));
  c.fillStyle = grad; c.fillRect(0, 0, W, H);
  if (bright < 0.9) stars.forEach(s => { c.fillStyle = `rgba(255,255,230,${(1 - bright) * (0.6 + 0.4 * Math.sin(t * 2 + s.p))})`; c.beginPath(); c.arc(s.x * W, s.y * hz, s.r, 0, TAU); c.fill(); });
  const AW = W * 0.42, AH = hz * 0.78, cx = W / 2;
  const pos = d => [cx + dot(d, g.east) * AW, hz - dot(d, g.n) * AH];
  const sp = pos(SUN), mp = pos(g.m);
  const sr = Math.min(W, H) * 0.09, mr = Math.min(W, H) * 0.1;
  if (bright > 0.3) { const o = clamp(bright, 0, 1); c.globalAlpha = o; cloud((t * 12) % (W + 200) - 120, H * 0.18, W / 700); cloud(((t * 8) + 400) % (W + 200) - 120, H * 0.3, W / 900); c.globalAlpha = 1; }
  body.sun = g.sunAlt > 0 ? { x: sp[0], y: sp[1], r: sr * 1.3 } : null;
  body.moon = g.moonAlt > 0 ? { x: mp[0], y: mp[1], r: mr * 1.2 } : null;
  if (g.sunAlt > 0) drawSun(sp[0], sp[1], sr);
  if (g.moonAlt > 0) drawMoon(mp[0], mp[1], mr, g.elong, Math.atan2(sp[1] - mp[1], sp[0] - mp[0]));
  // hills
  const gc = mix([20, 40, 50], [90, 190, 90], bright), gc2 = mix([14, 30, 40], [60, 160, 80], bright);
  c.fillStyle = rgb(gc2); c.beginPath(); c.moveTo(0, hz); c.quadraticCurveTo(W * 0.25, hz - H * 0.1, W * 0.5, hz); c.quadraticCurveTo(W * 0.75, hz + H * 0.05, W, hz - H * 0.04); c.lineTo(W, H); c.lineTo(0, H); c.fill();
  c.fillStyle = rgb(gc); c.beginPath(); c.moveTo(0, hz + H * 0.04); c.quadraticCurveTo(W * 0.3, hz - H * 0.02, W * 0.6, hz + H * 0.05); c.quadraticCurveTo(W * 0.85, hz + H * 0.08, W, hz + H * 0.02); c.lineTo(W, H); c.lineTo(0, H); c.fill();
  wig.sun *= 0.94; wig.moon *= 0.94;
  return g;
}
// ---- narration -------------------------------------------------------------
let lastMsg = '';
function say(text) {
  $('caption').textContent = text;
  if (text === lastMsg) return; lastMsg = text;
  if (voiceOn && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[^\w\s!?,.']/g, '')); u.rate = 0.85; u.pitch = 1.3; speechSynthesis.speak(u);
  }
}
function caption(g) {
  const sunUp = g.sunAlt > 0, moonUp = g.moonAlt > 0;
  if (sunUp && moonUp) return 'Look! The Moon is out in the daytime! 🌙☀️';
  if (sunUp) return 'Where is the Moon? It is playing on the other side of the world!';
  if (moonUp) return 'Night night, Moon! 🌙✨';
  return 'Shhh... sleepy time 😴';
}
// ---- sound -----------------------------------------------------------------
let ac;
function boop(f) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, ac.currentTime); o.frequency.exponentialRampToValueAtTime(f * 1.6, ac.currentTime + 0.12);
    g.gain.setValueAtTime(0.25, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.25);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.26);
  } catch (e) {}
}
// ---- input -----------------------------------------------------------------
let drag = null;
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = b => b && Math.hypot(x - b.x, y - b.y) < b.r;
  if (hit(body.moon)) { wig.moon = 1; boop(520); }
  else if (hit(body.sun)) { wig.sun = 1; boop(330); }
  drag = { x: e.clientX, hour, moved: false }; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 6) { drag.moved = true; playing = false; setPlayUi(); }
  if (drag.moved) hour = ((drag.hour - dx / W * 10) % 24 + 24) % 24;   // drag right = earlier, left = later
});
cv.addEventListener('pointerup', () => { drag = null; });
document.querySelectorAll('button[data-h]').forEach(b => b.addEventListener('click', () => {
  playing = false; setPlayUi(); hour = +b.dataset.h; day = +b.dataset.d; boop(440);
}));
function setPlayUi() { $('play').innerHTML = playing ? '⏸️<span>Stop</span>' : '▶️<span>Watch</span>'; $('play').classList.toggle('on', playing); }
$('play').addEventListener('click', () => { playing = !playing; if (playing) { day = 7.4; if (hour < 6) hour = 6; } setPlayUi(); boop(500); });
$('voice').addEventListener('click', () => { voiceOn = !voiceOn; $('voice').classList.toggle('on', voiceOn); $('voice').innerHTML = (voiceOn ? '🔊' : '🔈') + '<span>Voice</span>'; if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel(); lastMsg = ''; });

let prev = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - prev) / 1000); prev = t;
  if (playing) { hour += dt * 1.6; if (hour >= 24) hour = 6; }
  const g = draw(); say(caption(g));
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
